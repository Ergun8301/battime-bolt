name: CI

# Contrôle de chaque PR qui vise main OU une branche d'intégration : typecheck + build de production + budgets de poids, et (job « deno »)
# les tests du registre de l'assistant. Il n'existe pas de branche « integration » seule : les lots sont fusionnés dans integration/<nom>
# (integration/bemexo-ia, integration/chantier-3a-4…), d'où le motif integration/**. Pour que ces contrôles BLOQUENT, il faut aussi activer
# « Require status checks to pass » sur main et sur integration/** (réglage du dépôt GitHub, hors de ce fichier) : sans cela ils avertissent
# seulement.
on:
  pull_request:
    # main (production) et toutes les branches d'intégration ; les guillemets sont obligatoires, « ** » est un caractère spécial en YAML.
    branches: [main, 'integration/**']

jobs:
  typecheck-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Budgets de poids
        run: npm run budget -- build.log

      # Le navigateur ne doit embarquer aucun nom d'outil du registre : contrôle sur out/ (T8 build), obligatoire ici.
      - name: Registre absent du build (T8)
        env:
          REGISTRE_BUILD_OBLIGATOIRE: '1'
        run: npx -y deno@2.9.6 test --allow-env --allow-read supabase/functions/_shared/registre-couverture.test.ts --filter "T8 hygiène (build)"

  # Le registre de l'assistant : le test de couverture (T1 à T11), le scanner de l'interface et les outils existants. Sans réseau, sans base,
  # sans npm ci : seul Deno (téléchargé par npx, comme les scripts « test:* » de package.json) lit les sources du dépôt.
  deno:
    name: Registre de l'assistant (Deno)
    runs-on: ubuntu-latest
    steps:
      # L'historique complet : l'étape suivante compare la PR à sa branche de base (git diff base...HEAD), ce que le clone superficiel ne permet pas.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # npx a besoin de Node, déjà présent sur ubuntu-latest ; la version est fixée comme dans le job précédent pour que les deux se comportent pareil.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Une dette dont l'échéance est passée bloque seulement les PR qui touchent le registre ou l'interface (conception §2.3, T3) : un correctif
      # de sécurité sans rapport ne doit pas tomber le jour de l'échéance. On le décide ici ; le test lit REGISTRE_DETTES_PERIMEES.
      - name: La PR touche-t-elle le registre ou l'interface ?
        id: touche
        shell: bash
        run: |
          set -eo pipefail
          base="origin/${{ github.base_ref }}"
          # Dans un fichier : un échec de git fait échouer le job (jamais de repli silencieux sur « avertir »), et grep lit tout (pas de SIGPIPE).
          git diff --name-only "$base"...HEAD > "$RUNNER_TEMP/fichiers.txt"
          if grep -Eq '^(supabase/functions/_shared/registre|app/|components/|lib/|hooks/)' "$RUNNER_TEMP/fichiers.txt"; then
            echo "dettes=bloquer" >> "$GITHUB_OUTPUT"
          else
            echo "dettes=avertir" >> "$GITHUB_OUTPUT"
          fi

      # --allow-read : les tests lisent le code (app/, components/, lib/) ; --allow-env : réglages REGISTRE_* du test de couverture. Rien d'autre :
      # ni réseau, ni écriture. Les quatre fichiers sont ceux de « npm run test:couverture » et « npm run test:registre » (package.json).
      - name: Tests du registre
        env:
          REGISTRE_DETTES_PERIMEES: ${{ steps.touche.outputs.dettes }}
        run: >-
          npx -y deno@2.9.6 test --allow-env --allow-read
          supabase/functions/_shared/registre-couverture.test.ts
          supabase/functions/_shared/registre-surfaces.test.ts
          supabase/functions/_shared/registre-outils.test.ts
          supabase/functions/_shared/registre-listes.test.ts
          supabase/functions/_shared/registre-ouvreurs.test.ts
          supabase/functions/_shared/etape3-config.test.ts
          supabase/functions/_shared/etape3-eteint.test.ts
          supabase/functions/_shared/etape3-ouvrir.test.ts
          supabase/functions/_shared/ouvrir.test.ts
